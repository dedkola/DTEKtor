name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test .github/scripts/*.test.mjs
      - run: npm run lint

  docker:
    name: Docker builds and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INGEST_SECRET: disposable-ci-secret
      DTEKTOR_BUILD_SHA: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: dtektor-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: dtektor:latest
          build-args: DTEKTOR_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true
      - name: Build collector image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: collector/Dockerfile
          load: true
          tags: dtektor-collector:latest
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max,ignore-error=true
      - name: Start web container and wait for database API
        run: docker compose up --no-build --wait --wait-timeout 120 dtektor
      - name: Exercise Chromium, ingest and shared screenshots
        run: docker compose run --rm -e EXPECTED_SHA="$DTEKTOR_BUILD_SHA" collector
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p ci-diagnostics
          docker compose ps -a > ci-diagnostics/containers.txt
          docker compose logs --no-color --tail=150 > ci-diagnostics/containers.log 2>&1
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-diagnostics
          path: ci-diagnostics/
          retention-days: 7
      - name: Remove disposable CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  production:
    name: Verify production deployment
    needs: [code, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ vars.DTEKTOR_PUBLIC_URL || 'https://detektor.tkweb.dev' }}
    concurrency:
      group: production-verification
      cancel-in-progress: true
    env:
      EXPECTED_SHA: ${{ github.sha }}
      DTEKTOR_URL: ${{ vars.DTEKTOR_PUBLIC_URL || 'https://detektor.tkweb.dev' }}
      REQUIRE_HTTPS: 'true'
      DEPLOY_WAIT_SECONDS: '600'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Wait for this commit and verify the public application
        run: node .github/scripts/verify-production.mjs
